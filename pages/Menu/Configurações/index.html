<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurações</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <nav class="nav-icon">
      <span class="voltar">«</span>
      <h1>Configurações</h1>
    </nav>
  </header>

  <main>

    
    <h2 class="section-title">Conta</h2>
    <div class="grupo">
      <div class="item-perfil">
        <div class="avatar">
          <img src="../Assets/Generic avatar.png" alt="Perfil" />
        </div>
        <div class="item-info">
          <span class="item-titulo">Meu perfil</span>
          <span class="item-subtitulo">Ver e editar seus dados</span>
        </div>
        <span class="seta">›</span>
      </div>
    </div>

    
    <h2 class="section-title">Preferência</h2>
    <div class="grupo">
      <div class="item">
        <img src="../Assets/Bell.png" alt="Notificações" class="item-icon" />
        <span class="item-titulo">Notificações</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Assets/Moon.png" alt="Aparência" class="item-icon" />
        <span class="item-titulo">Aparência</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Assets/Globe.png" alt="Idioma" class="item-icon" />
        <span class="item-titulo">Idioma</span>
        <span class="seta">›</span>
      </div>
    </div>

    
    <h2 class="section-title">Segurança</h2>
    <div class="grupo">
      <div class="item">
        <img src="../Assets/Lock.png" alt="Senha e Segurança" class="item-icon" />
        <span class="item-titulo">Senha e Segurança</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Assets/Shield.png" alt="Privacidade" class="item-icon" />
        <span class="item-titulo">Privacidade</span>
        <span class="seta">›</span>
      </div>
    </div>

  
    <h2 class="section-title">Suporte</h2>
    <div class="grupo">
      <div class="item">
        <img src="../Assets/Help circle.png" alt="Ajuda e Suporte" class="item-icon" />
        <span class="item-titulo">Ajuda e Suporte</span>
        <span class="seta">›</span>
      </div>
      <div class="item">
        <img src="../Assets/Alert circle.png" alt="Sobre o aplicativo" class="item-icon" />
        <span class="item-titulo">Sobre o aplicativo</span>
        <span class="seta">›</span>
      </div>
    </div>

  </main>

</body>
</html>
