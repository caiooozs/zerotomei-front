<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações Pessoais</title>
    <link rel="stylesheet" href="../InformaçõesPessoais/style.css">
</head>
<body>
  <div>
    <div>
      <div class="header">
        <button class="icon-btn"><i data-lucide="chevron-left" size="28"></i></button>
        <h1 class="header-title">Informações pessoais</h1>
      </div>

      <div class="avatar-section">
        <div class="avatar-circle">E</div>
        <button class="edit-badge">Editar</button>
      </div>

      <div class="form-group">
        <div class="input-box">
          <label>Nome</label>
          <input type="text" placeholder="Evellyn Gomes" maxlength="65">
        </div>

        <div class="input-box">
          <label>Pronomes</label>
          <input type="text" placeholder="Ela/dela">
        </div>

        <div class="input-box">
          <label>Número</label>
          <div class="input-wrapper">
            <input type="text" placeholder="XX XX XXXX-XXXX">
            <span class="verified-icon"><i data-lucide="check-circle-2" size="18"></i></span>
          </div>
        </div>

        <div class="input-box">
          <label>Email</label>
          <div class="input-wrapper">
            <input type="email" placeholder="XXXXXXXX@gmail.com">
            <span class="verified-icon"><i data-lucide="check-circle-2" size="18"></i></span>
          </div>
        </div>

        <div class="bio-box">
          <div class="bio-content">
            <h3>Sobre</h3>
            <p>Sou uma nova empresária na área de perfumaria e produtos de beleza.</p>
          </div>
          <i data-lucide="chevron-right" size="24" style="color: #8b3232;"></i>
        </div>
      </div>

      <button class="save-btn">Salvar alterações</button>
    </div>
  </div>
</body>
</html>
   
     
    
</body>
</html>
