    <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informações Pessoais</title>
  <!-- Carregamento dos ícones Lucide -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #e5e5e5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 0;
    }

    /* Container do Mockup do Celular */
    .app-container {
      width: 100%;
      max-width: 375px;
      height: 760px;
      background-color: #ffffff;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border-radius: 28px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      border: 1px solid #e0e0e0;
    }

    .content {
      flex: 1;
      padding: 20px 24px;
      overflow-y: auto;
      padding-bottom: 90px;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 8px;
      margin-bottom: 20px;
    }

    .header-title {
      font-size: 24px;
      color: #1a1a1a;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #8b3232;
      display: flex;
      align-items: center;
      padding: 0;
    }

    /* Avatar */
    .avatar-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .avatar-circle {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #8b3232;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 36px;
      font-weight: 400;
    }

    .edit-badge {
      margin-top: 8px;
      background-color: #f9ecec;
      color: #8b3232;
      border: none;
      padding: 4px 16px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Form & Inputs */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-box {
      border: 1.5px solid #8b3232;
      border-radius: 14px;
      padding: 6px 14px;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: #fff;
    }

    .input-box label {
      font-size: 11px;
      color: #555555;
      margin-bottom: 1px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .input-box input {
      border: none;
      outline: none;
      font-size: 15px;
      color: #333333;
      width: 100%;
      background: transparent;
    }

    .char-counter {
      position: absolute;
      right: 12px;
      bottom: -14px;
      font-size: 9px;
      color: #777777;
    }

    .verified-icon {
      color: #8b3232;
      display: flex;
      align-items: center;
      margin-left: 8px;
    }

    /* Sobre Section */
    .bio-box {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      cursor: pointer;
    }

    .bio-content h3 {
      font-size: 13px;
      color: #8b3232;
      margin-bottom: 3px;
      font-weight: 700;
    }

    .bio-content p {
      font-size: 12px;
      color: #555555;
      line-height: 1.35;
      max-width: 250px;
    }

    /* Botão Salvar */
    .save-btn {
      width: 100%;
      background-color: #8b3232;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      margin-top: 28px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(139, 50, 50, 0.25);
    }

    /* Navigation Bar */
    .bottom-nav {
      position: absolute;
      bottom: 0;
      width: 100%;
      background-color: #f6efe9;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      padding: 8px 0 10px 0;
      border-top: 1px solid #eae1d9;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #8b3232;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.3px;
      flex: 1;
    }

    .nav-item i {
      margin-bottom: 3px;
    }

    .nav-item-center {
      margin-top: -18px;
    }

    .icon-circle {
      background-color: #f6efe9;
      border: 1px solid #dcd1c8;
      border-radius: 50%;
      padding: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 2px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="content">
      
      <!-- Topo -->
      <div class="header">
        <button class="icon-btn"><i data-lucide="chevron-left" size="28"></i></button>
        <h1 class="header-title">Informações pessoais</h1>
      </div>

      <!-- Foto de Perfil -->
      <div class="avatar-section">
        <div class="avatar-circle">E</div>
        <button class="edit-badge">Editar</button>
      </div>

      <!-- Formulário -->
      <div class="form-group">
        <div class="input-box">
          <label>Nome</label>
          <input type="text" value="Evellyn Gomes" maxlength="65">
          <span class="char-counter">12/65</span>
        </div>

        <div class="input-box">
          <label>Pronomes</label>
          <input type="text" value="Ela/dela">
        </div>

        <div class="input-box">
          <label>Número</label>
          <div class="input-wrapper">
            <input type="text" value="XX XX XXXX-XXXX">
            <span class="verified-icon"><i data-lucide="check-circle-2" size="18"></i></span>
          </div>
        </div>

        <div class="input-box">
          <label>Email</label>
          <div class="input-wrapper">
            <input type="email" value="XXXXXXXX@gmail.com">
            <span class="verified-icon"><i data-lucide="check-circle-2" size="18"></i></span>
          </div>
        </div>

        <div class="bio-box">
          <div class="bio-content">
            <h3>Sobre</h3>
            <p>Sou uma nova empresária na área de perfumaria e produtos de beleza.</p>
          </div>
          <i data-lucide="chevron-right" size="24" style="color: #8b3232;"></i>
        </div>
      </div>

      <button class="save-btn">Salvar alterações</button>
    </div>

    <!-- Navegação Inferior -->
    <nav class="bottom-nav">
      <a href="#" class="nav-item">
        <i data-lucide="home" size="20"></i>
        <span>HOME</span>
      </a>
      <a href="#" class="nav-item">
        <i data-lucide="wallet" size="20"></i>
        <span>FINANCEIRO</span>
      </a>
      <a href="#" class="nav-item nav-item-center">
        <div class="icon-circle">
          <i data-lucide="bar-chart-3" size="22"></i>
        </div>
        <span>MEU MEI</span>
      </a>
      <a href="#" class="nav-item">
        <i data-lucide="book-open" size="20"></i>
        <span>MENTORIAS</span>
      </a>
      <a href="#" class="nav-item">
        <i data-lucide="users" size="20"></i>
        <span>ATIVIDADES</span>
      </a>
    </nav>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
   
     
    
</body>
</html>
