<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../shared/styles/reset.css">
  <link rel="stylesheet" href="../../shared/styles/global.css">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

  <section id="tela-inicia-container">

    <div class="titulo">
      <h2>Cursos e mentorias</h2>
    </div>

    <div class="container-card">
      <div class="card-tela">

        <img src="./Assets/macbook-air-on-desk 1.png" alt="Curso de controle financeiro">

        <h2>Como controlar suas finanças</h2>

        <p> Aprenda a ter controle total do seu dinheiro. </p>

        <div class="textos-cards">
          <p>20 Min</p>
          <span>Grátis</span>
        </div>

      </div>


      <div class="card-tela">
        <img id="redondo" src="./Assets/professional-smiling-woman 1.png" alt="Mentora">

        <h2>Finanças para iniciantes</h2>
        <p>Mentoria com Fernanda</p>
        <div class="textos-cards">
          <div class="avaliacao">
            <i>
              <img src="./Assets/Star.svg" alt="Estrela">
            </i>
            <span>4,8</span>
          </div>

          <small>Online</small>
        </div>
      </div>
    </div>



    <div class="pendencias">
      <div class="card-pendencias">

        <i class="icone-pendencia">
          <img src="./Assets/Ellipse 63.svg" alt="">
        </i>

        <div class="texto-pendencia">
          <h2>Verificar pendências</h2>
          <p>
            Fazer a verificação em relação as pendências de funcionários
          </p>
        </div>
        <i class="botao-adicionar">
          <img src="./Assets/Plus.svg" alt="Adicionar">
        </i>
      </div>

      <div class="atividades">
        <h2>Adicionar Atividade</h2>

        <i>
          <img src="./Assets/Plus.svg" alt="Adicionar atividade">
        </i>

      </div>
    </div>

  </section>

</body>
</html>
