
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Do Zero ao MEI</title>
  <link rel="stylesheet" href="style.css">
  <!-- Ícones do FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="login-container">
    
    <!-- Lembre-se de colocar a imagem da sua logo com o nome logo.png na mesma pasta -->
    <div class="logo-container">
      <img src="">
    </div>

    <h2 class="title">CADASTRO</h2>

    <form id="loginForm">
      <div class="input-group">
        <input type="email" id="email" placeholder="E-mail" required>
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Criar senha" required>
      </div>
      <div class="input-group">
        <input type="password" id="password" placeholder="Confirme sua senha" required>
      </div>

    

      <button type="submit" class="btn-primary">CRIAR CONTA</button>
    </form>

    <!-- Botões sociais corrigidos -->
    <div class="social-login">
      <button type="button" class="btn-social google">
        <i class="fa-brands fa-google"></i>
      </button>
      <button type="button" class="btn-social facebook">
        <i class="fa-brands fa-facebook-f"></i>
      </button>
      <button type="button" class="btn-social menu">
        <i class="fa-solid fa-bars-staggered"></i>
      </button>
    </div>



  <script src="script.js"></script>
</body>
</html>
